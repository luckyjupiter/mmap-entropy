[project]
name = "mmap-entropy"
version = "0.1.0"
description = "A fixed-layout memory-mapped ring for local byte-chunk transport"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Lengfelder" }]
keywords = ["mmap", "shared-memory", "ring-buffer", "ipc", "transport"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Operating System Kernels",
]
dependencies = []

[project.urls]
Repository = "https://github.com/luckyjupiter/mmap-entropy"
Issues = "https://github.com/luckyjupiter/mmap-entropy/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mmap-entropy = "mmap_entropy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
